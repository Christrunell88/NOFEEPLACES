<!DOCTYPE html>
<html>
<head>
    <title>Auth Debug - NoFeePlaces</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #00ff00; }
        .box { background: #2a2a2a; padding: 15px; margin: 10px 0; border: 1px solid #00ff00; }
        button { background: #00ff00; color: black; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; }
        input { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        pre { background: black; padding: 10px; overflow-x: auto; }
        .success { color: #00ff00; }
        .error { color: #ff0000; }
    </style>
</head>
<body>
    <h1>🔧 Authentication Debug Console</h1>
    
    <div class="box">
        <h2>Environment Detection</h2>
        <pre id="env"></pre>
    </div>

    <div class="box">
        <h2>Quick Login Test</h2>
        <input type="email" id="email" value="chris.trunell@gmail.com" placeholder="Email">
        <input type="password" id="pass" value="Onetimeround247" placeholder="Password">
        <button onclick="testLogin()">🚀 Test Login</button>
        <button onclick="testBackend()">🔍 Ping Backend</button>
        <button onclick="clearStorage()">🗑️ Clear Storage</button>
        <pre id="result"></pre>
    </div>

    <div class="box">
        <h2>Storage Inspection</h2>
        <button onclick="checkStorage()">📦 Check LocalStorage</button>
        <pre id="storage"></pre>
    </div>

    <script>
        const log = (id, msg) => {
            document.getElementById(id).textContent += msg + '\n';
        };

        // Detect environment
        function detectEnv() {
            const hostname = window.location.hostname;
            let backendUrl;
            
            if (hostname === 'nofeeplaces.com' || hostname === 'www.nofeeplaces.com') {
                backendUrl = window.location.origin;
            } else if (hostname === 'localhost' || hostname === '127.0.0.1') {
                backendUrl = 'http://localhost:8001';
            } else {
                backendUrl = window.location.origin;
            }

            const info = {
                'Current URL': window.location.href,
                'Hostname': hostname,
                'Protocol': window.location.protocol,
                'Detected Backend': backendUrl,
                'Login Endpoint': backendUrl + '/api/auth/login',
                'Browser': navigator.userAgent.substring(0, 100),
                'Time': new Date().toISOString()
            };

            let output = '';
            for (const [key, val] of Object.entries(info)) {
                output += `${key}: ${val}\n`;
            }
            document.getElementById('env').textContent = output;
            
            return backendUrl;
        }

        async function testLogin() {
            const result = document.getElementById('result');
            result.textContent = 'Testing login...\n';

            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const backend = detectEnv().split('\n').find(l => l.includes('Detected Backend')).split(': ')[1];
            
            try {
                const response = await fetch(backend + '/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: pass })
                });

                const data = await response.json();
                
                if (response.ok && data.access_token) {
                    result.textContent = '✅ LOGIN SUCCESS!\n\n';
                    result.textContent += 'Token: ' + data.access_token.substring(0, 50) + '...\n';
                    result.textContent += 'User: ' + JSON.stringify(data.user, null, 2);
                    result.className = 'success';
                    
                    // Save to localStorage
                    localStorage.setItem('token', data.access_token);
                    log('result', '\n📦 Token saved to localStorage');
                } else {
                    result.textContent = '❌ LOGIN FAILED\n\n';
                    result.textContent += 'Status: ' + response.status + '\n';
                    result.textContent += 'Error: ' + JSON.stringify(data, null, 2);
                    result.className = 'error';
                }
            } catch (err) {
                result.textContent = '❌ NETWORK ERROR\n\n' + err.message;
                result.className = 'error';
            }
        }

        async function testBackend() {
            const result = document.getElementById('result');
            result.textContent = 'Pinging backend...\n';
            
            const backend = detectEnv().split('\n').find(l => l.includes('Detected Backend')).split(': ')[1];
            
            try {
                const response = await fetch(backend + '/api/apartments?limit=1');
                const data = await response.json();
                
                if (response.ok) {
                    result.textContent = '✅ BACKEND ALIVE!\n\n';
                    result.textContent += 'Status: ' + response.status + '\n';
                    result.textContent += 'Apartments found: ' + (data.apartments?.length || 0);
                    result.className = 'success';
                } else {
                    result.textContent = '⚠️ Backend responded with error\n';
                    result.textContent += 'Status: ' + response.status;
                    result.className = 'error';
                }
            } catch (err) {
                result.textContent = '❌ BACKEND UNREACHABLE\n\n' + err.message;
                result.className = 'error';
            }
        }

        function checkStorage() {
            const storage = document.getElementById('storage');
            const token = localStorage.getItem('token');
            
            storage.textContent = 'LocalStorage Contents:\n\n';
            storage.textContent += 'Token: ' + (token ? token.substring(0, 50) + '... ✅' : '❌ Not found') + '\n';
            storage.textContent += '\nAll keys:\n';
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const val = localStorage.getItem(key);
                storage.textContent += `- ${key}: ${val.substring(0, 50)}${val.length > 50 ? '...' : ''}\n`;
            }
        }

        function clearStorage() {
            localStorage.clear();
            alert('LocalStorage cleared!');
            checkStorage();
        }

        // Auto-detect on load
        detectEnv();
        checkStorage();
    </script>
</body>
</html>
