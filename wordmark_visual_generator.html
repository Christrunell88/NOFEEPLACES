<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoFeePlaces WordMark - Visual Assets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }
        .wordmark-export {
            display: inline-block;
            padding: 3rem;
        }
        .page-break {
            page-break-after: always;
        }
    </style>
</head>
<body>
    <!-- Dark Background Wordmark for Export -->
    <div id="wordmark-dark" class="min-h-screen bg-gradient-to-br from-slate-900 via-gray-900 to-slate-800 flex items-center justify-center page-break">
        <div class="wordmark-export">
            <div class="flex flex-col">
                <!-- Large Version -->
                <div class="flex items-baseline space-x-0 mb-16">
                    <span class="text-8xl font-extralight text-white tracking-wide">No</span>
                    <span class="text-8xl font-bold text-emerald-400 tracking-tight">Fee</span>
                    <span class="text-4xl font-light text-gray-300 tracking-[0.2em] ml-4 mt-2">PLACES</span>
                </div>
                
                <!-- Medium Version -->
                <div class="flex items-baseline space-x-0 mb-12">
                    <span class="text-5xl font-extralight text-white tracking-wide">No</span>
                    <span class="text-5xl font-bold text-emerald-400 tracking-tight">Fee</span>
                    <span class="text-2xl font-light text-gray-300 tracking-[0.2em] ml-2 mt-1">PLACES</span>
                </div>
                
                <!-- Small Version -->
                <div class="flex items-baseline space-x-0">
                    <span class="text-3xl font-extralight text-white tracking-wide">No</span>
                    <span class="text-3xl font-bold text-emerald-400 tracking-tight">Fee</span>
                    <span class="text-lg font-light text-gray-300 tracking-[0.2em] ml-2 mt-0.5">PLACES</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Light Background Wordmark for Export -->
    <div id="wordmark-light" class="min-h-screen bg-white flex items-center justify-center page-break">
        <div class="wordmark-export">
            <div class="flex flex-col">
                <!-- Large Version -->
                <div class="flex items-baseline space-x-0 mb-16">
                    <span class="text-8xl font-extralight text-gray-800 tracking-wide">No</span>
                    <span class="text-8xl font-bold text-emerald-600 tracking-tight">Fee</span>
                    <span class="text-4xl font-light text-gray-600 tracking-[0.2em] ml-4 mt-2">PLACES</span>
                </div>
                
                <!-- Medium Version -->
                <div class="flex items-baseline space-x-0 mb-12">
                    <span class="text-5xl font-extralight text-gray-800 tracking-wide">No</span>
                    <span class="text-5xl font-bold text-emerald-600 tracking-tight">Fee</span>
                    <span class="text-2xl font-light text-gray-600 tracking-[0.2em] ml-2 mt-1">PLACES</span>
                </div>
                
                <!-- Small Version -->
                <div class="flex items-baseline space-x-0">
                    <span class="text-3xl font-extralight text-gray-800 tracking-wide">No</span>
                    <span class="text-3xl font-bold text-emerald-600 tracking-tight">Fee</span>
                    <span class="text-lg font-light text-gray-600 tracking-[0.2em] ml-2 mt-0.5">PLACES</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Transparent Background Version -->
    <div id="wordmark-transparent" class="min-h-screen bg-gray-100 flex items-center justify-center" style="background: repeating-conic-gradient(#f3f4f6 0% 25%, transparent 0% 50%) 50% / 20px 20px;">
        <div class="wordmark-export bg-transparent">
            <div class="flex flex-col">
                <!-- Large Version - Dark text for transparency -->
                <div class="flex items-baseline space-x-0 mb-16">
                    <span class="text-8xl font-extralight text-gray-800 tracking-wide">No</span>
                    <span class="text-8xl font-bold text-emerald-600 tracking-tight">Fee</span>
                    <span class="text-4xl font-light text-gray-600 tracking-[0.2em] ml-4 mt-2">PLACES</span>
                </div>
                
                <!-- Medium Version -->
                <div class="flex items-baseline space-x-0 mb-12">
                    <span class="text-5xl font-extralight text-gray-800 tracking-wide">No</span>
                    <span class="text-5xl font-bold text-emerald-600 tracking-tight">Fee</span>
                    <span class="text-2xl font-light text-gray-600 tracking-[0.2em] ml-2 mt-1">PLACES</span>
                </div>
                
                <!-- Small Version -->
                <div class="flex items-baseline space-x-0">
                    <span class="text-3xl font-extralight text-gray-800 tracking-wide">No</span>
                    <span class="text-3xl font-bold text-emerald-600 tracking-tight">Fee</span>
                    <span class="text-lg font-light text-gray-600 tracking-[0.2em] ml-2 mt-0.5">PLACES</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
