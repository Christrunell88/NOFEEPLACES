<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoFeePlaces WordMark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-8">
    
    <!-- Dark Background Version -->
    <div class="bg-gradient-to-r from-slate-900 to-gray-900 p-12 rounded-2xl mb-8">
        <div class="flex flex-col">
            <!-- Main Wordmark -->
            <div class="flex items-baseline space-x-0">
                <span class="text-4xl font-extralight text-white tracking-wide">No</span>
                <span class="text-4xl font-bold text-emerald-400 tracking-tight">Fee</span>
                <span class="text-xl font-light text-gray-300 tracking-[0.2em] ml-2 mt-1">PLACES</span>
            </div>
            
            <!-- Subtle Underline -->
            <div class="w-full h-0.5 bg-gradient-to-r from-emerald-400/60 via-blue-400/40 to-transparent mt-1"></div>
            
            <!-- Tagline -->
            <div class="text-xs text-gray-400 font-medium tracking-widest mt-1">
                NYC RENTAL PLATFORM
            </div>
        </div>
    </div>

    <!-- Light Background Version -->
    <div class="bg-white p-12 rounded-2xl shadow-lg">
        <div class="flex flex-col">
            <!-- Main Wordmark -->
            <div class="flex items-baseline space-x-0">
                <span class="text-4xl font-extralight text-gray-800 tracking-wide">No</span>
                <span class="text-4xl font-bold text-emerald-600 tracking-tight">Fee</span>
                <span class="text-xl font-light text-gray-600 tracking-[0.2em] ml-2 mt-1">PLACES</span>
            </div>
            
            <!-- Subtle Underline -->
            <div class="w-full h-0.5 bg-gradient-to-r from-emerald-600/50 via-blue-500/30 to-transparent mt-1"></div>
            
            <!-- Tagline -->
            <div class="text-xs text-gray-500 font-medium tracking-widest mt-1">
                NYC RENTAL PLATFORM
            </div>
        </div>
    </div>

</body>
</html>
